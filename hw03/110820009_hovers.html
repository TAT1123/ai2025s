<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>D3.js 散點圖</title>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: linear-gradient(to bottom, #87CEFA, #ffffff); /* 藍天到白色漸層 */
            font-family: Arial, sans-serif;
        }
        #tooltip {
            position: absolute;
            text-align: center;
            width: 150px;
            height: 150px;
            padding: 4px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
        }
        .axis-label {
            fill: #003366; /* 深藍色 */
            font-size: 14px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

<script>
    // 設定 SVG 畫布大小
    var margin = {top: 20, right: 30, bottom: 40, left: 60},
        width = 1200 - margin.left - margin.right, // 寬一點，畫面更滿
        height = 600 - margin.top - margin.bottom;

    // 加入 SVG
    var svg = d3.select("body").append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    // 載入 CSV 資料
    d3.csv("hsu.csv").then(function(data) {

        // 設定 X 軸
        var x = d3.scaleLinear().domain([0, 1]).range([0, width]);
        svg.append("g")
            .attr("transform", "translate(0," + height + ")")
            .call(d3.axisBottom(x))
            .append("text")
            .attr("class", "axis-label")
            .attr("x", width)
            .attr("y", 30)
            .style("text-anchor", "end")
            .text("SSIM");

        // 設定 Y 軸
        var y = d3.scaleLinear().domain([0, 1]).range([height, 0]);
        svg.append("g")
            .call(d3.axisLeft(y))
            .append("text")
            .attr("class", "axis-label")
            .attr("transform", "rotate(-90)")
            .attr("x", 0)
            .attr("y", -40)
            .attr("dy", ".71em")
            .style("text-anchor", "end")
            .text("LPIPS");

        // 過濾資料
        var filteredData = data.filter(function(d) {
            return d.SSIM >= 0 && d.SSIM <= 1 && d.LPIPS >= 0 && d.LPIPS <= 1;
        });

        // 畫點
        svg.append('g')
            .selectAll("circle")
            .data(filteredData)
            .enter()
            .append("circle")
            .attr("cx", function(d) { return x(d.SSIM); })
            .attr("cy", function(d) { return y(d.LPIPS); })
            .attr("r", 10)
            .style("fill", "#3399FF");

        // 加標籤（學號）
        svg.append('g')
            .selectAll("text")
            .data(filteredData)
            .enter()
            .append("text")
            .attr("x", function(d) { return x(d.SSIM) + 12; })
            .attr("y", function(d) { return y(d.LPIPS) - 12; })
            .text(function(d) { return d.Student; })
            .attr("font-size", "12px")
            .attr("fill", "#003366")
            .style("text-anchor", "start");

        // 工具提示
        var tooltip = d3.select("body").append("div")
            .attr("id", "tooltip")
            .style("opacity", 0);

        svg.selectAll("circle")
			.on("mouseover", function(event, d) {
			tooltip.transition()
				.duration(200)
				.style("opacity", .95);

			var imgBase = "110820009/" + d.Student;
			var imgPng = imgBase + ".png";
			var imgJpg = imgBase + ".jpg";

			var testImg = new Image();
			testImg.src = imgPng;

			testImg.onload = function() {
				tooltip.html("<img src='" + imgPng + "' alt='手寫圖片' width='140' height='140'>")
					.style("left", (event.pageX + 10) + "px")
					.style("top", (event.pageY - 50) + "px");
			};

			testImg.onerror = function() {
				tooltip.html("<img src='" + imgJpg + "' alt='手寫圖片' width='140' height='140'>")
					.style("left", (event.pageX + 10) + "px")
					.style("top", (event.pageY - 50) + "px");
			};
		})
		.on("mouseout", function(d) {
			tooltip.transition()
				.duration(500)
				.style("opacity", 0);
		});
    });
</script>

</body>
</html>
